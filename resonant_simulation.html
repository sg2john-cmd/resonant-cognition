<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonant Cognition: True Solar Model Visualizer (v7.0)</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 340px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            z-index: 10;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #111622 0%, #070a10 100%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        h3 { 
            margin-top: 0; 
            color: #58a6ff; 
            font-weight: 600; 
            border-bottom: 1px solid #30363d; 
            padding-bottom: 8px;
            font-size: 16px;
        }
        .metric-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            height: 180px;
            overflow-y: auto;
        }
        .btn {
            background-color: #238636;
            color: white;
            border: 1px solid rgba(240,246,252,0.1);
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn:hover { background-color: #2ea043; }
        .btn-purge { background-color: #da3633; }
        .btn-purge:hover { background-color: #f85149; }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
        }
        .slider-group label { display: flex; justify-content: space-between; }
        input[type=range] { width: 100%; accent-color: #58a6ff; }
        .panel-metric {
            font-size: 12px;
            background-color: #0d1117;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #21262d;
            font-family: monospace;
        }
        .highlight { color: #ffac33; font-weight: bold; }
        .synergy { color: #ff55ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>v7.0 True Solar Controller</h3>
        
        <div class="slider-group">
            <label><span>System Entropy Matrix</span><span id="chaos-val">1.0</span></label>
            <input type="range" id="chaos-slider" min="0.2" max="4.0" step="0.1" value="1.0">
        </div>

        <div class="slider-group">
            <label><span>Quantum Echo Trail Retention</span><span id="echo-val">0.94</span></label>
            <input type="range" id="echo-slider" min="0.80" max="0.99" step="0.01" value="0.94">
        </div>

        <div class="panel-metric">
            System Dissonance: <span id="ui-dissonance">0.00</span><br>
            Adaptive Solar Pull: <span id="ui-solar-mass" class="highlight">1.50</span>
        </div>

        <button class="btn btn-purge" id="purge-btn">Execute Singular Defragmentation Purge</button>

        <h3>Quantum State Terminal</h3>
        <div class="metric-box" id="terminal-log">> Solar Engine active.<br>> Baseline Gravity: 1.50.<br>> 4 Planet Manifolds deployed.<br>> Satellites tracking parent worlds.</div>
    </div>

    <div id="canvas-container">
        <canvas id="simulationCanvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const logBox = document.getElementById('terminal-log');

        let externalChaos = 1.0;
        let echoRetention = 0.94; 
        let isPurging = false;
        let purgeProgress = 0;
        let aggregateSystemStress = 0.0;
        let dynamicSolarMass = 1.5;

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // FIXED: All planetary array nodes written out with absolute numeric constants
        const system = {
            star: { x: 0, y: 0, baseRadius: 26, pulse: 0, color: '#ffac33', name: 'Central Star' },
            planets: [
                { 
                    name: 'Logic Facet', baseDistance: 110, distance: 110, speed: 0.012, size: 10, angle: 0, color: '#58a6ff',
                    idX: 4, idY: 5, superegoX: -6, superegoY: -4, stress: 0,
                    moons: [{ name: 'Logic Stabilizer Moon', baseDistance: 24, distance: 24, speed: 0.05, angle: 0, color: '#a371f7' }]
                },
                { 
                    name: 'Creative Intuition', baseDistance: 180, distance: 180, speed: -0.008, size: 13, angle: 1.8, color: '#bc8cff',
                    idX: -5, idY: 7, superegoX: -8, superegoY: -6, stress: 0,
                    moons: [{ name: 'Creativity Stabilizer Moon', baseDistance: 32, distance: 32, speed: -0.03, angle: Math.PI, color: '#ff7b72' }]
                },
                { 
                    name: 'Safety Guard', baseDistance: 250, distance: 250, speed: 0.006, size: 15, angle: 3.4, color: '#3fb950',
                    idX: 2, idY: -3, superegoX: -12, superegoY: -10, stress: 0, moons: []
                },
                { 
                    name: 'Aggressive Drive', baseDistance: 330, distance: 330, speed: 0.018, size: 9, angle: 4.8, color: '#f85149',
                    idX: 6, idY: 4, superegoX: -2, superegoY: -2, stress: 0, moons: []
                }
            ],
            asteroids: []
        };

        for(let i=0; i<75; i++) {
            system.asteroids.push({
                baseDistance: 210 + Math.random() * 35, distance: 210, speed: 0.004 + Math.random() * 0.006,
                angle: Math.random() * Math.PI * 2, size: 1 + Math.random() * 1.5
            });
        }

        document.getElementById('chaos-slider').addEventListener('input', (e) => {
            externalChaos = parseFloat(e.target.value);
            document.getElementById('chaos-val').innerText = externalChaos.toFixed(1);
        });
        document.getElementById('echo-slider').addEventListener('input', (e) => {
            echoRetention = parseFloat(e.target.value);
            document.getElementById('echo-val').innerText = echoRetention.toFixed(2);
        });
        document.getElementById('purge-btn').addEventListener('click', () => {
            if(!isPurging) {
                isPurging = true;
                purgeProgress = 0;
                terminalPrint("CRITICAL: Initializing Fractal Singular Purge Matrix...");
            }
        });

        function terminalPrint(text) {
            logBox.innerHTML += `<br>> ${text}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function draw() {
            ctx.fillStyle = `rgba(13, 17, 23, ${1 - echoRetention})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            let t = Date.now() * 0.001;
            let targetX = centerX + Math.cos(t * 0.7) * (140 * Math.sin(t * 0.3));
            let targetY = centerY + Math.sin(t * 0.5) * (110 * Math.cos(t * 0.2));

            if (isPurging) { targetX = centerX; targetY = centerY; }

            aggregateSystemStress = 0.0;
            system.planets.forEach(p => {
                let px = centerX + Math.cos(p.angle) * p.distance;
                let py = centerY + Math.sin(p.angle) * p.distance;
                p.stress = Math.sqrt((targetX - px)**2 + (targetY - py)**2) / 150;
                aggregateSystemStress += p.stress;
            });

            let normalizedStress = aggregateSystemStress / system.planets.length;
            if (!isPurging) {
                dynamicSolarMass = Math.min(1.5 + (Math.pow(normalizedStress, 1.8) * externalChaos), 8.0);
            } else {
                dynamicSolarMass = 8.0 * (1.0 - purgeProgress);
            }

            document.getElementById('ui-dissonance').innerText = normalizedStress.toFixed(2);
            document.getElementById('ui-solar-mass').innerText = dynamicSolarMass.toFixed(2);

            system.star.pulse += 0.035;
            let currentStarRadius = (system.star.baseRadius + (dynamicSolarMass * 4)) + Math.sin(system.star.pulse) * 1.5;
            if(isPurging) currentStarRadius = system.star.baseRadius * (1.0 - purgeProgress);

            let grad = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, Math.max(5, currentStarRadius));
            grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.4, system.star.color); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(centerX, centerY, Math.max(5, currentStarRadius * 1.3), 0, Math.PI * 2); ctx.fill();

            system.asteroids.forEach(ast => {
                if(!isPurging) {
                    ast.angle += ast.speed * externalChaos;
                    ast.distance = ast.baseDistance - ((dynamicSolarMass - 1.5) * 4);
                } else { ast.distance = Math.max(0, ast.distance - 6); }
                let ax = centerX + Math.cos(ast.angle) * ast.distance;
                let ay = centerY + Math.sin(ast.angle) * ast.distance;
                ctx.fillStyle = 'rgba(139, 148, 158, 0.35)'; ctx.beginPath(); ctx.arc(ax, ay, ast.size, 0, Math.PI * 2); ctx.fill();
            });

            system.planets.forEach((p) => {
                if (!isPurging) {
                    p.angle += p.speed * externalChaos;
                    p.distance = p.baseDistance - ((dynamicSolarMass - 1.5) * 9);
                } else { p.distance = Math.max(0, p.distance - 4); }

                let px = centerX + Math.cos(p.angle) * p.distance;
                let py = centerY + Math.sin(p.angle) * p.distance;

                ctx.strokeStyle = p.color + '25'; ctx.lineWidth = 1;
                let idx = px + p.idX * externalChaos; let idy = py + p.idY * externalChaos;
                ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(idx, idy); ctx.stroke();
                let spx = px + p.superegoX; let spy = py + p.superegoY;
                ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(spx, spy); ctx.stroke();

                if ((1.5 / (p.stress + 0.1)) > 2.5 && !isPurging) {
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, p.size * 1.6, 0, Math.PI * 2); ctx.stroke();
                    if(Math.random() < 0.01) terminalPrint(`<span class='synergy'>🔥 SYNERGY: ${p.name} locked vector focus!</span>`);
                }

                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(px, py, Math.max(1, p.size * (1.0 - purgeProgress)), 0, Math.PI * 2); ctx.fill();

                p.moons.forEach(moon => {
                    if (!isPurging) { moon.angle += moon.speed * externalChaos; moon.distance = moon.baseDistance + (p.stress * 8); }
                    let mx = px + Math.cos(moon.angle) * moon.distance; let my = py + Math.sin(moon.angle) * moon.distance;
                    ctx.strokeStyle = moon.color + '15'; ctx.beginPath(); ctx.arc(px, py, moon.distance, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = moon.color; ctx.beginPath(); ctx.arc(mx, my, Math.max(1, 3.5 * (1.0 - purgeProgress)), 0, Math.PI * 2); ctx.fill();
                });
            });

            if (isPurging) {
                purgeProgress += 0.008;
                if (Math.random() < 0.12) terminalPrint(`Crushing fragments: LATENCY_HASH_${Math.floor(Math.random() * 999)}...`);
                if (purgeProgress >= 1) {
                    isPurging = false; purgeProgress = 0;
                    system.planets.forEach(p => p.distance = p.baseDistance);
                    terminalPrint("<span class='highlight'>SUCCESS: White Hole emission complete. Baseline values optimized.</span>");
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
