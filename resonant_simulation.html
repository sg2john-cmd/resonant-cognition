<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonant Cognition: Fluid 7-Planet Engine Prototype</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 320px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            z-index: 10;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #111622 0%, #070a10 100%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        h3 { margin-top: 0; color: #58a6ff; font-weight: 600; border-bottom: 1px solid #30363d; padding-bottom: 8px;}
        .metric-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            max-height: 200px;
            overflow-y: auto;
        }
        .btn {
            background-color: #238636;
            color: white;
            border: 1px solid rgba(240,246,252,0.1);
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn:hover { background-color: #2ea043; }
        .btn-purge { background-color: #da3633; }
        .btn-purge:hover { background-color: #f85149; }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
        }
        .slider-group label { display: flex; justify-content: space-between; }
        input[type=range] { width: 100%; accent-color: #58a6ff; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>Resonant Control Panel</h3>
        
        <div class="slider-group">
            <label><span>Stochastic Periphery Chaos</span><span id="chaos-val">1.0</span></label>
            <input type="range" id="chaos-slider" min="0" max="3" step="0.1" value="1">
        </div>

        <div class="slider-group">
            <label><span>Residual Echo Memory</span><span id="echo-val">0.95</span></label>
            <input type="range" id="echo-slider" min="0.8" max="0.99" step="0.01" value="0.95">
        </div>

        <button class="btn btn-purge" id="purge-btn">Execute Singular Black Hole Purge</button>

        <h3>Quantum State Terminal</h3>
        <div class="metric-box" id="terminal-log">> System initialized.<br>> Field Barycenter aligned.<br>> 7 Intent Spheres active.</div>
    </div>

    <div id="canvas-container">
        <canvas id="simulationCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const logBox = document.getElementById('terminal-log');

        let chaosFactor = 1.0;
        let echoRetention = 0.95; // Controls trail fade length
        let isPurging = false;
        let purgeProgress = 0;

        // Resize Canvas
        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // System Config: 7 Personas (The Sun, 4 Planets, 2 Moons)
        const system = {
            core: { x: 0, y: 0, radius: 24, pulse: 0, color: '#ffac33', name: 'Core Attractor' },
            bodies: [
                { id: 1, name: 'Logic Facet', distance: 90, speed: 0.015, size: 10, angle: 0, color: '#58a6ff' },
                { id: 2, name: 'Creative Intuition', distance: 150, speed: -0.01, size: 12, angle: 1.5, color: '#bc8cff' },
                { id: 3, name: 'Safety Guard', distance: 210, speed: 0.007, size: 14, angle: 3, color: '#3fb950' },
                { id: 4, name: 'Aggressive Drive (Id)', distance: 280, speed: 0.022, size: 8, angle: 4.5, color: '#f85149' },
                { id: 5, name: 'Regulatory Moon A', distance: 30, speed: 0.06, size: 4, angle: 0, parentIdx: 1, color: '#8b949e' },
                { id: 6, name: 'Regulatory Moon B', distance: 35, speed: -0.04, size: 5, angle: 2, parentIdx: 2, color: '#8b949e' }
            ],
            asteroids: []
        };

        // Populate Asteroid Belt (Raw Noise Debris)
        for(let i=0; i<60; i++) {
            system.asteroids.push({
                distance: 170 + Math.random() * 25,
                speed: 0.005 + Math.random() * 0.01,
                angle: Math.random() * Math.PI * 2,
                size: 1 + Math.random() * 2
            });
        }

        // Sliders Input Listeners
        document.getElementById('chaos-slider').addEventListener('input', (e) => {
            chaosFactor = parseFloat(e.target.value);
            document.getElementById('chaos-val').innerText = chaosFactor.toFixed(1);
        });
        document.getElementById('echo-slider').addEventListener('input', (e) => {
            echoRetention = parseFloat(e.target.value);
            document.getElementById('echo-val').innerText = echoRetention.toFixed(2);
        });
        document.getElementById('purge-btn').addEventListener('click', () => {
            if(!isPurging) {
                isPurging = true;
                purgeProgress = 0;
                terminalPrint("CRITICAL WARN: Initializing Singular Black Hole Purge...");
            }
        });

        function terminalPrint(text) {
            logBox.innerHTML += `<br>> ${text}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Main Animation Engine Loop
        function draw() {
            // Quantum Echo Pond Mapping: Fade background slowly to trap movement trails (Echoes)
            ctx.fillStyle = `rgba(13, 17, 23, ${1 - echoRetention})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Render Core System Barycenter / Gravitational Well
            system.core.pulse += 0.03;
            let currentCoreRadius = system.core.radius + Math.sin(system.core.pulse) * 2;
            
            if (isPurging) {
                ctx.fillStyle = '#ffffff';
                currentCoreRadius = system.core.radius * (1 - purgeProgress);
            } else {
                let grad = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, currentCoreRadius * 2);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, system.core.color);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
            }
            ctx.beginPath();
            ctx.arc(centerX, centerY, isPurging ? Math.max(2, currentCoreRadius) : currentCoreRadius * 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Render Asteroid Belt Noise Field
            ctx.fillStyle = 'rgba(139, 148, 158, 0.4)';
            system.asteroids.forEach(ast => {
                if(!isPurging) ast.angle += ast.speed * chaosFactor;
                else ast.distance = Math.max(0, ast.distance - 4);
                
                let ax = centerX + Math.cos(ast.angle) * ast.distance;
                let ay = centerY + Math.sin(ast.angle) * ast.distance;
                ctx.beginPath();
                ctx.arc(ax, ay, ast.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Tracking Vectors for Wave Collapse Intersections
            let activeIntersections = [];

            // Update & Render Planetary Trajectories
            system.bodies.forEach((body) => {
                if (!isPurging) {
                    body.angle += body.speed;
                }

                let bx, by;
                if (body.parentIdx !== undefined) {
                    // Moon Coordinates relative to Planet parent node
                    let parent = system.bodies[body.parentIdx];
                    let px = centerX + Math.cos(parent.angle) * parent.distance;
                    let py = centerY + Math.sin(parent.angle) * parent.distance;
                    if(isPurging) body.distance = Math.max(0, body.distance - 2);
                    bx = px + Math.cos(body.angle) * body.distance;
                    by = py + Math.sin(body.angle) * body.distance;
                } else {
                    // Standard Planet Path Orbit
                    if(isPurging) body.distance = Math.max(0, body.distance - 3);
                    bx = centerX + Math.cos(body.angle) * body.distance;
                    by = centerY + Math.sin(body.angle) * body.distance;
                }

                // Render continuous field circles (The Intersections Matrix)
                ctx.strokeStyle = body.color + '15'; 
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(bx, by, body.size * 4 * chaosFactor, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Core Solid mass node
                ctx.fillStyle = body.color;
                ctx.beginPath();
                ctx.arc(bx, by, Math.max(1, body.size * (1 - purgeProgress)), 0, Math.PI * 2);
                ctx.fill();

                // Track non-moon bodies for calculation
                if (!isPurging && body.parentIdx === undefined) {
                    activeIntersections.push({ x: bx, y: by });
                }
            });

            // Calculate Wave Collapse Vector Crosshair Destination (Live Resonant Center)
            if (activeIntersections.length > 0 && !isPurging) {
                let targetX = activeIntersections.reduce((sum, p) => sum + p.x, 0) / activeIntersections.length;
                let targetY = activeIntersections.reduce((sum, p) => sum + p.y, 0) / activeIntersections.length;

                ctx.strokeStyle = 'rgba(88, 166, 255, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);

                // Render crosshair vector target box
                ctx.beginPath();
                ctx.arc(targetX, targetY, 8, 0, Math.PI * 2);
                ctx.moveTo(targetX - 15, targetY); 
                ctx.lineTo(targetX + 15, targetY);
                ctx.moveTo(targetX, targetY - 15); 
                ctx.lineTo(targetX, targetY + 15);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Manage Purge Execution Physics
            if (isPurging) {
                purgeProgress += 0.01;
                
                if (Math.random() < 0.15) {
                    terminalPrint(`Defragmenting address range space: NULLIFY_DATA_BLOCK_${Math.floor(Math.random() * 900)}`);
                }
                
                if (purgeProgress >= 1) {
                    isPurging = false;
                    purgeProgress = 0;
                    
                    // Reset positions perfectly following singularity optimization
                    system.bodies.forEach(b => {
                        b.distance = b.parentIdx !== undefined ? (b.id === 5 ? 30 : 35) : (b.id === 1 ? 90 : b.id === 2 ? 150 : b.id === 3 ? 210 : 280);
                    });
                    
                    for (let i = 0; i < 60; i++) {
                        system.asteroids[i].distance = 170 + Math.random() * 25;
                    }
                    
                    terminalPrint("SUCCESS: Topological cleanup complete. Perfect barycentric alignment achieved.");
                }
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
